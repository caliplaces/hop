name: CI

# Feature PRs target staging; releases are PRs from staging into main.
# Merging a PR pushes to staging or main: CI runs again on the merged code and,
# if it passes, deploys that branch (staging -> staging.onmyhop.com,
# main -> onmyhop.com). "Run workflow" on either branch redeploys it.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Superseded PR runs can stop; runs that deploy always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build

  # Only this repository's staging branch may be released into main.
  release-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check where this pull request comes from
        # Branch names are user-controlled: read them from env vars, never
        # interpolate them into the script.
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = "main" ] && { [ "$HEAD" != "staging" ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::Pull requests into main must come from the staging branch of $REPO. Please open your pull request against staging."
            exit 1
          fi
          echo "OK: $HEAD_REPO:$HEAD -> $BASE"

  deploy:
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Each environment only accepts its own branch (staging <- staging,
    # production <- main) and holds that environment's Cloudflare token.
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://onmyhop.com' || 'https://staging.onmyhop.com' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TARGET: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The Cloudflare token is only given to the steps below, never to
      # dependency installs or the build.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN secret on the $TARGET environment and the CLOUDFLARE_ACCOUNT_ID variable on the repository."
            exit 1
          fi
      - name: Apply database migrations
        run: pnpm --filter @hop/api exec wrangler d1 migrations apply DB --remote --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy worker
        run: pnpm --filter @hop/api exec wrangler deploy --env "$TARGET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Staging only lets allowlisted IPs through, so only production is probed.
      - name: Check production is up
        if: env.TARGET == 'production'
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://onmyhop.com/api/health
