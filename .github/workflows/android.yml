name: Android

# Builds the Android app, runs its unit tests and lint, and checks the release
# build shrinks cleanly. Runs only when the app, or the shared files its tests
# compare against, change.
on:
  pull_request:
    branches: [staging, main]
    paths:
      - "apps/android/**"
      - "packages/shared/src/colors.ts"
      - "packages/shared/src/handles.ts"
      - ".github/workflows/android.yml"
  push:
    branches: [staging, main]
    paths:
      - "apps/android/**"
      - "packages/shared/src/colors.ts"
      - "packages/shared/src/handles.ts"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks the Gradle wrapper is the genuine one.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Unit tests, lint, and debug and release builds
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain
